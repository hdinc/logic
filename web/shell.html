<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logic</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; color: #ccc; font: 14px sans-serif; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; pointer-events: none; }
</style>
<!-- threads need cross-origin isolation. static hosts like github pages can't
     send the headers, this service worker adds them. it reloads on its own
     before it controls the page, so the reload is done below instead. -->
<script>window.coi = { doReload: function () {}, quiet: true };</script>
<script src="coi-serviceworker.js"></script>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<!-- emscripten's script tag, started only once the page is isolated -->
<template id="program">{{{ SCRIPT }}}</template>
<script>
  var status_el = document.getElementById('status');
  function show_status(text) { status_el.textContent = text; status_el.style.display = text ? 'flex' : 'none'; }

  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) { if (text) show_status(text); },
    onRuntimeInitialized: function () { show_status(''); document.getElementById('canvas').focus(); },
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); },
  };

  function start() {
    window.addEventListener('error', function () { show_status('logic stopped with an error, see the browser console.'); });
    var scripts = document.getElementById('program').content.querySelectorAll('script');
    for (var i = 0; i < scripts.length; i++) {
      // a copy made here runs, the template's own doesn't
      var s = document.createElement('script');
      for (var a = 0; a < scripts[i].attributes.length; a++) s.setAttribute(scripts[i].attributes[a].name, scripts[i].attributes[a].value);
      s.textContent = scripts[i].textContent;
      document.body.appendChild(s);
    }
  }

  var reloads = 0;
  try { reloads = +sessionStorage.getItem('logic-coi-reloads') || 0; } catch (e) {}
  function set_reloads(n) { try { sessionStorage.setItem('logic-coi-reloads', n); } catch (e) {} }

  if (window.crossOriginIsolated) {
    set_reloads(0);
    start();
  } else if (window.isSecureContext && navigator.serviceWorker && reloads < 3) {
    // the service worker's responses carry the headers once it's active
    navigator.serviceWorker.ready.then(function () {
      set_reloads(reloads + 1);
      window.location.reload();
    });
  } else {
    show_status('logic needs cross-origin isolation for its threads. The page couldn\'t get it: ' +
      (window.isSecureContext ? 'service workers are off here (private mode?).' : 'it must be served over https or from localhost.'));
  }
</script>
</body>
</html>
